spring.datasource.url=jdbc:postgresql://localhost:5432/trading_system
spring.datasource.username=postgres
spring.datasource.password=YOUR_PASSWORD_HERE

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
twelvedata.api.key=YOUR_API_KEY_HERE

# Breakout scanner thresholds
trading.scanner.breakout.min-prior-move=30
trading.scanner.breakout.max-prior-move=100
trading.scanner.breakout.min-adr=3
trading.scanner.breakout.min-avg-volume=1000000
trading.scanner.breakout.max-consolidation-range=15
trading.scanner.breakout.max-pullback=25
# Breakout flag (consolidation) window in trading days - approximates the flag phase
trading.scanner.breakout.flag-window=20
trading.scanner.breakout.flagpole-window=60
trading.scanner.breakout.max-volume-contraction=0.8

# Account settings for position sizing
trading.account.size=YOUR_ACCOUNT_SIZE_HERE
trading.account.max-position-percent=0.20
# Risk per trade varies with market regime: the source specifies 0.5% as the
# default and 1.0% in an offensive regime, never above 1.0%.
trading.account.risk-percent-defensive=0.005
trading.account.risk-percent-offensive=0.01

# Episodic pivot scanner thresholds
trading.scanner.episodic-pivot.min-gap=10
trading.scanner.episodic-pivot.min-relative-volume=1
trading.scanner.episodic-pivot.min-volume-vs-yesterday=2
# Episodic pivot intraday settings
trading.scanner.episodic-pivot.opening-range-minutes=15

# Sell rules
trading.sellrules.min-trim-r=2
trading.sellrules.min-days-held=3
trading.sellrules.max-days-held=5
trading.sellrules.ma-period=10

# Stock universe filter
trading.universe.min-price=5
trading.universe.min-avg-volume=1000000
trading.universe.min-adr=4
# How stale a stored market cap may be before it's re-fetched. Fundamentals
# change slowly, so a weekly refresh is enough and keeps API usage down.
trading.universe.market-cap-max-age-days=7

# Parabolic short
# min-daily-gain-percent is not from the source document - it guards against a
# technically "accelerating" but trivially small run (3% -> 4%) qualifying as
# parabolic. Set to 0 to disable.
trading.scanner.parabolic.min-daily-gain-percent=5
trading.scanner.parabolic.min-large-cap-move-percent=50
# Mid cap is not defined in the source document, which only specifies large
# (>10B, 50-100%) and small (<2B, 300-1000%). 120 is the geometric midpoint of
# the source's own two thresholds (sqrt(50*300)), chosen over the ~100% cited by
# secondary sources since those use a lower small-cap threshold (200%) and so
# aren't directly comparable. Recalibrate against real data.
trading.scanner.parabolic.min-mid-cap-move-percent=120
trading.scanner.parabolic.min-small-cap-move-percent=300
trading.scanner.parabolic.small-cap-max-usd=2000000000
trading.scanner.parabolic.large-cap-min-usd=10000000000
trading.scanner.parabolic.lookback-days=15
trading.scanner.parabolic.min-consecutive-up-days=3

# Parabolic short breakdown trigger
trading.scanner.parabolic.min-breakdown-volume-ratio=1.5
# Churning thresholds are our quantification of a qualitative description
# in the source document - recalibrate against real data
trading.scanner.parabolic.min-churn-volume-ratio=2.0
trading.scanner.parabolic.max-churn-price-percent=2